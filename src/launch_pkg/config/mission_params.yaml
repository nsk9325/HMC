# run.sh 가 자동 생성한다. 직접 고치지 말고 run.sh 상단의 변수를 수정할 것.
/**:
  ros__parameters:
    cruise_speed: 255
    approach_speed: 200
    min_move_speed: 40
    max_reverse_speed: 0
    steering_gain: 0.2
