    stopline_trigger_y: 430
    stopline_latch_sec: 8.0
    car_stop_bbox_height: 230
    approach_timeout_sec: 30.0
    path_timeout_sec: 1.0
    blind_forward_sec: 2.0
    blind_forward_speed: 90
